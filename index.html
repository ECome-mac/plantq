<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PlantQ</title>
<meta name="theme-color" content="#EFEBE6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PlantQ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Stile Hearth (Greige Rose), solo tema chiaro. Layout: app a una colonna per iPhone, barra schede in basso. */
:root{
  --canvas:#EFEBE6;--surface:#F8F5F2;--sunken:#E4DDD4;--raised:#FFFFFF;
  --line:#DDD3CC;--line-strong:#8F8580;
  --ink:#2A2224;--ink-muted:#4A3E3E;--ink-subtle:#6B5E5E;
  --rose:#C98C8C;--rose-line:#B07474;--rose-ink:#2A2224;--rose-text:#8F4A4F;--rose-soft:#EBCFCF;--rose-soft-ink:#6E3A3A;
  --success:#5E8063;--success-soft:#E1E6D6;--success-ink:#344530;
  --warning:#A87820;--warning-soft:#F4E6C8;--warning-ink:#6B4A0E;
  --error:#C0605A;--error-soft:#F2D9D6;--error-ink:#8A2F2A;
  --scrim:rgba(42,34,36,0.45);--shadow:0 8px 24px rgba(42,34,36,0.12);
  --display:'Fraunces',Georgia,serif;--body:'Instrument Sans',system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--canvas)}
body{
  margin:0;color:var(--ink);font-family:var(--body);font-size:16px;line-height:24px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0;
  background-color:var(--canvas);
  background-image:radial-gradient(circle at center,rgba(211,203,198,.7) .75px,transparent 1px);background-size:22px 22px;
  -webkit-text-size-adjust:100%;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--rose-text);outline-offset:2px}
.app{max-width:520px;margin:0 auto;padding:20px 0 120px}
.brand{margin:0 0 18px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.brand img{display:block;height:auto;max-width:100%}
.eyebrow{margin:0;font-size:12px;line-height:16px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-subtle)}
h1{margin:6px 0 0;font-family:var(--display);font-style:italic;font-weight:400;font-size:36px;line-height:42px;letter-spacing:-.02em;text-wrap:balance}
h2{margin:0;font-family:var(--display);font-weight:600;font-size:22px;line-height:30px;letter-spacing:-.01em}
h3{margin:0;font-family:var(--display);font-weight:600;font-size:18px;line-height:26px;letter-spacing:-.01em}
.sub{margin:8px 0 0;color:var(--ink-muted)}
.stack{display:flex;flex-direction:column;gap:12px}
.section{margin-top:28px}
.section>.eyebrow{margin-bottom:12px}
.card{padding:16px;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.muted{color:var(--ink-muted)}.subtle{color:var(--ink-subtle)}
.small{font-size:14px;line-height:22px}.tiny{font-size:12px;line-height:18px}
.dot{flex:none;width:10px;height:10px;border-radius:50%}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:12px;line-height:18px;font-weight:500;white-space:nowrap}
.pill.ok{background:var(--success-soft);color:var(--success-ink)}
.pill.late{background:var(--error-soft);color:var(--error-ink)}
.pill.warn{background:var(--warning-soft);color:var(--warning-ink)}
.pill.neutral{background:var(--sunken);color:var(--ink-muted)}
.pill.rose{background:var(--rose-soft);color:var(--rose-soft-ink)}
.btn{min-height:44px;padding:0 16px;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface);color:var(--ink);font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{border-color:var(--rose-line);background:var(--rose);color:var(--rose-ink)}
.btn.small{min-height:40px;padding:0 14px;font-size:14px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-muted)}
.btn.danger{border-color:var(--error);color:var(--error-ink);background:var(--surface)}
.iconbtn{flex:none;width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border:1px solid transparent;border-radius:10px;background:transparent;color:var(--ink-muted)}
.iconbtn.sm{width:36px;height:36px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:14px;line-height:22px;font-weight:500}
.input,select.input,textarea.input{width:100%;min-height:44px;padding:8px 12px;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface);font-size:16px}
textarea.input{min-height:104px;resize:vertical;line-height:24px}
.input::placeholder{color:var(--ink-subtle);opacity:1}
.hint{margin:0;font-size:12px;line-height:18px;color:var(--ink-subtle)}

/* Barra schede */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--canvas);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabbar nav{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tab{min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:0;border-radius:12px;background:transparent;color:var(--ink-muted);font-size:12px;line-height:16px;font-weight:500}
.tab[aria-current="page"]{background:var(--sunken);color:var(--rose-text)}
.tab svg,.iconbtn svg,.btn svg{flex:none}

/* Interruttore */
.switch{flex:none;position:relative;width:52px;height:32px;padding:0;border:1px solid var(--line-strong);border-radius:999px;background:var(--sunken)}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--raised);box-shadow:0 1px 3px rgba(42,34,36,.3);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--success);border-color:var(--success)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.hit{position:relative}.hit::before{content:"";position:absolute;inset:-6px -4px}

/* Calendario */
.calhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:20px}
.calhead h2{text-transform:capitalize}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:12px}
.dow{text-align:center;font-size:12px;line-height:18px;font-weight:600;letter-spacing:.06em;color:var(--ink-subtle)}
.day{min-height:52px;padding:4px 2px 6px;border:1px solid transparent;border-radius:10px;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:2px;font-size:15px;line-height:20px;font-variant-numeric:tabular-nums}
.day.blank{background:transparent;border-color:transparent;pointer-events:none}
.day.today{border-color:var(--rose-line);font-weight:600}
.day[aria-pressed="true"]{background:var(--rose-soft);border-color:var(--rose-line);color:var(--rose-soft-ink)}
.dots{display:flex;gap:3px;height:8px;align-items:center}
.dots i{width:6px;height:6px;border-radius:50%;display:block}
.dots b{font-size:10px;line-height:8px;font-weight:600;color:var(--ink-subtle)}

/* Classi */
.cls{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 16px;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.cls.off,.card.off{background:transparent;border-style:dashed}
.card.off h3{color:var(--ink-subtle)}
.cls.off .open{opacity:.65}
.open{flex:1;min-width:0;display:flex;align-items:center;gap:12px;min-height:56px;padding:0;border:0;background:transparent;text-align:left}
.chev{flex:none;color:var(--ink-subtle)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:4px;min-height:32px;padding:0 12px;border-radius:999px;background:var(--sunken);color:var(--ink-muted);font-size:14px}
.chip button{border:0;background:transparent;padding:0;width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-muted)}
.band{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.band:first-of-type{border-top:0}
.bandedit{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.bandedit select,.bandedit input{min-height:44px;padding:6px 8px;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface);font-size:16px}
.bandedit input{width:72px}
.bandedit select[data-c="bandF"]{flex:1;min-width:150px}
.banner{padding:12px 16px;border-radius:10px;background:var(--warning-soft);color:var(--warning-ink);font-size:14px;line-height:22px}
.banner.info{background:var(--sunken);color:var(--ink-muted)}

/* Foglio e avviso */
.scrim{position:fixed;inset:0;z-index:40;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;max-height:90%;overflow:auto;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));border-radius:24px 24px 0 0;background:var(--raised);box-shadow:var(--shadow)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:30;max-width:calc(100% - 32px);padding:10px 16px;border-radius:10px;background:var(--success-soft);color:var(--success-ink);font-size:14px;line-height:22px;box-shadow:var(--shadow)}
.proposal{margin-top:12px;padding:12px;border-radius:10px;background:var(--rose-soft);color:var(--rose-soft-ink)}
.empty{padding:24px 16px;text-align:center;color:var(--ink-muted);border:1px dashed var(--line-strong);border-radius:16px}
.divider{height:1px;background:var(--line);border:0;margin:16px 0}
@media (prefers-reduced-motion:reduce){.switch::after{transition:none}}
[hidden]{display:none!important}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.stat{padding:12px;border:1px solid var(--line);border-radius:16px;background:var(--surface);display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--display);font-size:28px;line-height:32px;font-weight:600;color:var(--rose-text)}
.stat span{font-size:12px;line-height:16px;color:var(--ink-subtle)}
.arow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.aname{margin:0;font-weight:500}
.anote{margin:2px 0 0;font-style:italic}
.printonly{display:none}
@media print{
  html,body{background:#fff!important}
  body{background-image:none!important;color:#000}
  .tabbar,.toast,.scrim,.calhead,.grid,.noprint,.brand,.app>.eyebrow,.app>h1,.app>.section,.app>.hint{display:none!important}
  .printonly{display:block!important}
  .app{max-width:none;padding:0}
  table{width:100%;border-collapse:collapse;font-size:12pt}
  th,td{border:1px solid #888;padding:6px 8px;text-align:left;vertical-align:top}
}
</style>
</head>
<body>
<div class="app" id="app" aria-live="off"></div>
<div id="layer"></div>

<script>
(function(){
'use strict';
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
/* ---------- date ---------- */
var DAY=864e5;
function dnOf(y,m,d){return Math.floor(Date.UTC(y,m,d)/DAY);}
function dt(dn){return new Date(dn*DAY);}
function todayDN(){var n=new Date();return dnOf(n.getFullYear(),n.getMonth(),n.getDate());}
var MON=['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
function fmt(dn,o){return dt(dn).toLocaleDateString('it-IT',Object.assign({timeZone:'UTC'},o));}
function yearOf(dn){return dt(dn).getUTCFullYear();}
function monthOf(dn){return dt(dn).getUTCMonth()+1;}
function monthsOf(a,b){var r=[],m=a;for(var i=0;i<12;i++){r.push(m);if(m===b)break;m=m%12+1;}return r;}

/* ---------- dati di esempio ---------- */
var COLORS={agrumi:'#B8862B',verdi:'#5E8063',orchidee:'#B07474',grasse:'#4F8299',aromatiche:'#7E8F4E',fiore:'#8E5F86',orto:'#B56A44'};
function B(s){return s.split(',').map(function(p){var q=p.split(':'),r=q[0].split('-').map(Number);return{a:r[0],b:r[1]||r[0],d:q[1]==='x'?0:+q[1]};});}
var uidN=100;function uid(){return 'x'+(uidN++)+Math.random().toString(36).slice(2,5);}
function seed(){
  var t=todayDN(),k=0;
  function A(name,bands){var a={id:uid(),name:name,bands:B(bands),last:null};
    var b=a.bands.filter(function(x){return x.d>0;});
    if(b.length){a.last=t;}
    return a;}
  var C=[
   {id:'agrumi',name:'Agrumi',env:'Esterno',plants:['Limone','Mandarino'],acts:[A('Annaffiare','3-5:5,6-8:3,9-10:7,11-2:14'),A('Concimare','3-8:21'),A('Controllo parassiti','3-10:15'),A('Potatura','3:x'),A('Rinvaso','4:x'),A('Ricovero dal freddo','10-11:x'),A("Rimettere all'aperto",'4:x')]},
   {id:'verdi',name:'Piante verdi',env:'Interno',plants:['Ficus','Pothos'],acts:[A('Annaffiare','3-9:7,10-2:14'),A('Concimare','4-9:21'),A('Pulire le foglie','1-12:30'),A('Controllo parassiti','1-12:30'),A('Rinvaso','4:x')]},
   {id:'orchidee',name:'Orchidee',env:'Interno',plants:['Phalaenopsis'],acts:[A('Annaffiare (immersione)','3-10:7,11-2:10'),A('Concimare','3-10:14'),A('Controllo radici e parassiti','1-12:30'),A('Taglio stelo dopo la fioritura','3-6:x'),A('Rinvaso','3-5:x')]},
   {id:'grasse',name:'Piante grasse',env:'Entrambi',plants:['Aloe','Echeveria'],acts:[A('Annaffiare','4-5:14,6-8:10,9:14'),A('Concimare','4-9:30'),A('Controllo cocciniglia','3-10:30'),A('Rinvaso','4:x'),A('Ricovero dal freddo','10:x'),A("Rimettere all'aperto",'5:x')]},
   {id:'aromatiche',name:'Aromatiche',env:'Esterno',plants:['Rosmarino','Basilico'],acts:[A('Annaffiare','3-5:3,6-8:2,9-10:4,11-2:10'),A('Concimare','4-9:30'),A('Raccolta e cimatura','5-9:14'),A('Semina o trapianto','3-4:x')]},
   {id:'fiore',name:'Piante da fiore',env:'Esterno',plants:['Gerani'],acts:[A('Annaffiare','3-5:3,6-8:2,9-10:4,11-2:10'),A('Concimare','3-9:14'),A('Togliere i fiori appassiti','4-10:7'),A('Trattamento antiparassitario','4-10:15'),A('Potatura','2-3:x'),A('Ricovero invernale','10-11:x')]},
   {id:'orto',name:'Frutta e orto',env:'Esterno',plants:['Pomodori'],acts:[A('Annaffiare','4-5:3,6-8:2,9:4'),A('Concimare','3-9:21'),A('Semina o trapianto','3-5:x'),A('Trattamenti antiparassitari','4-9:15'),A('Raccolta','6-10:x'.replace(':x',':7')),A('Potatura e pulizia di fine stagione','11:x')]}
  ];
  C.forEach(function(c){c.on=true;c.color=COLORS[c.id];c.plants=[];});
  return {classes:C,log:[],notes:[]};
}

/* ---------- stato ---------- */
var KEY='plantq-v1';
function load(){try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);if(o&&o.classes)return o;}}catch(e){}return null;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
var S=load()||seed();
var T=todayDN();
var UI={tab:'oggi',cls:null,edit:false,confirm:null,y:yearOf(T),m:dt(T).getUTCMonth(),sel:T,sheet:null,toast:'',draft:'',draftLink:''};

/* ---------- logica attivita ---------- */
function inBand(b,m){return b.a<=b.b?(m>=b.a&&m<=b.b):(m>=b.a||m<=b.b);}
function bandAtRaw(act,dn){var m=monthOf(dn);for(var i=0;i<act.bands.length;i++)if(inBand(act.bands[i],m))return act.bands[i];return null;}
function firstActive(act,dn){for(var i=0;i<400;i++){var b=bandAtRaw(act,dn+i);if(b&&b.d>0)return dn+i;}return null;}
function nextAfter(act,dn){
  var b=bandAtRaw(act,dn);
  if(b&&b.d>0){var c=dn+b.d,bc=bandAtRaw(act,c);if(bc&&bc.d>0)return c;return firstActive(act,c);}
  return firstActive(act,dn+1);
}
function hasPeriodic(act){return act.bands.some(function(b){return b.d>0;});}
function nextDue(act){
  if(!hasPeriodic(act))return null;
  if(act.last!=null)return nextAfter(act,act.last);
  return firstActive(act,T);
}
function windows(b,y){
  if(b.a<=b.b)return [[dnOf(y,b.a-1,1),dnOf(y,b.b,0)]];
  return [[dnOf(y-1,b.a-1,1),dnOf(y,b.b,0)],[dnOf(y,b.a-1,1),dnOf(y+1,b.b,0)]];
}
function doneIn(act,s,e){return S.log.some(function(l){return l.actId===act.id&&l.dn>=s&&l.dn<=e;});}
function onceDueNow(act){
  var y=yearOf(T),out=null;
  act.bands.forEach(function(b){
    if(b.d!==0||out)return;
    windows(b,y).forEach(function(w){if(!out&&T>=w[0]&&T<=w[1]&&!doneIn(act,w[0],w[1]))out={dn:w[0],end:w[1],band:b};});
  });
  return out;
}
function occurrences(act,A,Bd){
  var out=[],cur=nextDue(act),g=0;
  if(cur!=null&&hasPeriodic(act)){
    if(act.last==null&&cur<A){cur=cur;}
    while(cur!=null&&cur<=Bd&&g++<3000){if(cur>=A)out.push({dn:cur,kind:'p'});cur=nextAfter(act,cur);}
  }
  for(var y=yearOf(A)-1;y<=yearOf(Bd);y++){
    act.bands.forEach(function(b){
      if(b.d!==0)return;
      windows(b,y).forEach(function(w){if(w[0]>=A&&w[0]<=Bd&&!doneIn(act,w[0],w[1]))out.push({dn:w[0],kind:'o',end:w[1]});});
    });
  }
  return out;
}
function classOf(id){return S.classes.find(function(c){return c.id===id;});}
function actOf(c,id){return c.acts.find(function(a){return a.id===id;});}
var FREQ=[[7,'ogni 1 settimana'],[14,'ogni 2 settimane'],[30,'ogni 1 mese'],[60,'ogni 2 mesi'],[0,'1 volta nel periodo']];
function freqText(d){for(var i=0;i<FREQ.length;i++)if(FREQ[i][0]===d)return FREQ[i][1];return 'ogni '+d+' giorni';}
function freqOptions(d){var s='',f=false;FREQ.forEach(function(x){if(x[0]===d)f=true;s+='<option value="'+x[0]+'"'+(x[0]===d?' selected':'')+'>'+x[1]+'</option>';});if(!f)s='<option value="'+d+'" selected>'+freqText(d)+'</option>'+s;return s;}
function bandText(b){
  var r=MON[b.a-1]+(b.b!==b.a?'–'+MON[b.b-1]:'');
  return r+' · '+freqText(b.d);
}
function periodText(act){
  var b=bandAtRaw(act,T);
  if(b)return b.d>0?(freqText(b.d).charAt(0).toUpperCase()+freqText(b.d).slice(1)):'Una volta nel periodo '+MON[b.a-1]+(b.b!==b.a?'–'+MON[b.b-1]:'');
  return '';
}
function markDone(clsId,actId,dn,note){
  var c=classOf(clsId),a=c&&actOf(c,actId);if(!a)return;
  S.log.push({id:uid(),clsId:clsId,actId:actId,dn:dn,note:note||''});
  if(a.last==null||dn>a.last)a.last=dn;
  save();
}
function undoLog(id){
  var l=S.log.find(function(x){return x.id===id;});if(!l)return;
  S.log=S.log.filter(function(x){return x.id!==id;});
  var c=classOf(l.clsId),a=c&&actOf(c,l.actId);
  if(a){var rest=S.log.filter(function(x){return x.actId===a.id;}).map(function(x){return x.dn;});a.last=rest.length?Math.max.apply(null,rest):null;}
  save();
}
function todayItems(){
  var late=[],soon=[];
  S.classes.forEach(function(c){if(!c.on)return;c.acts.forEach(function(a){
    if(a.on===false)return;
    var d=nextDue(a);
    if(d!=null){
      if(d<=T)late.push({c:c,a:a,dn:d,kind:'p'});
      else if(d<=T+7)soon.push({c:c,a:a,dn:d,kind:'p'});
    }
    var o=onceDueNow(a);if(o)late.push({c:c,a:a,dn:T,kind:'o',end:o.end,band:o.band});
  });});
  late.sort(function(x,y){return x.dn-y.dn;});soon.sort(function(x,y){return x.dn-y.dn;});

function monthItems(y,m){
  var A=dnOf(y,m,1),Bd=dnOf(y,m+1,0),map={};

    if(a.on===false)return;
    occurrences(a,A,Bd).forEach(function(o){add(o.dn,{c:c,a:a,dn:o.dn,kind:o.kind,done:false});});
  });});
  S.log.forEach(function(l){var c=classOf(l.clsId);if(!c||!c.on)return;if(l.dn<A||l.dn>Bd)return;var a=actOf(c,l.actId);if(!a)return;add(l.dn,{c:c,a:a,dn:l.dn,done:true,log:l});});
  return map;
}

var SEASONS={primavera:[3,5],estate:[6,8],autunno:[9,11],inverno:[12,2]};
function noteLabel(link){
  if(!link)return 'Generale';
  var p=link.split(':');
  if(p[0]==='c'){var c=classOf(p[1]);return c?c.name:'Generale';}
  var c2=classOf(p[1]);return p[2]+(c2?' · '+c2.name:'');
}
function analyze(text,link){
  var t=text.toLowerCase(),m=t.match(/ogni\s+(\d{1,3})\s+giorn/);
  if(!m)return null;
  var n=+m[1],cls=null;
  if(link){cls=classOf(link.split(':')[1]);}
  if(!cls)cls=S.classes.find(function(c){return t.indexOf(c.name.toLowerCase().slice(0,5))>-1;});
  if(!cls)cls=S.classes.find(function(c){return c.plants.some(function(p){return t.indexOf(p.toLowerCase())>-1;});});
  if(!cls)return {error:'Non so a quale classe riferire la modifica. Collega la nota a una classe o a una pianta.'};
  var words=t.split(/[^a-zàèéìòù]+/);
  var act=cls.acts.find(function(a){var stem=a.name.toLowerCase().split(' ')[0].slice(0,6);return words.some(function(w){return w.indexOf(stem)===0;});});
  if(!act)return {error:'Non trovo un’attività di '+cls.name+' citata nella nota.'};
  var season=null;Object.keys(SEASONS).forEach(function(k){if(!season&&t.indexOf(k)>-1)season=SEASONS[k];});
  var cm=new Date().getMonth()+1,r=season||[cm,cm];
  return {clsId:cls.id,actId:act.id,n:n,a:r[0],b:r[1],
    text:act.name+' ('+cls.name+'): ogni '+n+' giorni, '+MON[r[0]-1]+(r[1]!==r[0]?'–'+MON[r[1]-1]:'')};
}
function applyProposal(p){
  var c=classOf(p.clsId),a=c&&actOf(c,p.actId);if(!a)return;
  var want=monthsOf(p.a,p.b),hit=false;
  a.bands.forEach(function(b){var has=monthsOf(b.a,b.b).some(function(x){return want.indexOf(x)>-1;});if(has){b.d=p.n;hit=true;}});
  if(!hit)a.bands.push({a:p.a,b:p.b,d:p.n});
}

    h+='<hr class="divider">'+(UI.confirm==='delcls'?'<div class="row" style="flex-wrap:wrap"><button class="btn danger" data-a="delClsYes" data-c="'+c.id+'">Conferma: elimina '+esc(c.name)+'</button><button class="btn ghost" data-a="confirmNo">Annulla</button></div>':'<button class="btn danger" data-a="delClsAsk">Elimina questa classe</button>');
  }
  h+='</div>';
  return h;
}

function viewNote(){
  var h='<p class="eyebrow">Quaderno</p><h1>Note</h1><p class="sub">Scrivi o detta una nota. Per dettare, tocca il microfono sulla tastiera dell’iPhone.</p>';
  h+='<div class="section card stack"><div class="field"><label for="noteText">Nota</label><textarea class="input" id="noteText" placeholder="Es. Il limone ha le foglie gialle. Concimare ogni 10 giorni in primavera.">'+esc(UI.draft)+'</textarea></div>';
  h+='<div class="field"><label for="noteLink">Riferita a</label><select class="input" id="noteLink"><option value="">Generale</option><optgroup label="Classi">'+S.classes.map(function(c){return '<option value="c:'+c.id+'"'+(UI.draftLink==='c:'+c.id?' selected':'')+'>'+esc(c.name)+'</option>';}).join('')+'</optgroup>';
  S.classes.forEach(function(c){if(c.plants.length)h+='<optgroup label="Piante · '+esc(c.name)+'">'+c.plants.map(function(p){var v='p:'+c.id+':'+p;return '<option value="'+esc(v)+'"'+(UI.draftLink===v?' selected':'')+'>'+esc(p)+'</option>';}).join('')+'</optgroup>';});
  h+='</select></div><button class="btn primary" data-a="noteSave">Salva nota</button>';
  h+='<p class="hint">Per ora l’analisi riconosce frasi come “concimare ogni 10 giorni in primavera” e ti propone la modifica. Non cambia nulla finché non confermi.</p></div>';
  h+='<div class="section"><p class="eyebrow">Note salvate</p><div class="stack">';
  if(!S.notes.length)h+='<div class="empty">Nessuna nota. La prima che salvi compare qui.</div>';
  S.notes.slice().reverse().forEach(function(n){
    h+='<div class="card"><p style="margin:0;white-space:pre-wrap;overflow-wrap:anywhere">'+esc(n.text)+'</p><div class="row" style="margin-top:10px;flex-wrap:wrap;justify-content:space-between"><div class="row" style="gap:8px;flex-wrap:wrap"><span class="pill neutral">'+esc(noteLabel(n.link))+'</span><span class="tiny subtle">'+fmt(n.dn,{day:'numeric',month:'long'})+'</span></div><button class="btn ghost small" data-a="noteDel" data-id="'+n.id+'">Elimina</button></div>';
    if(n.prop&&n.state==='proposta')h+='<div class="proposal"><p class="eyebrow" style="color:var(--rose-soft-ink)">Modifica proposta</p><p style="margin:4px 0 12px;font-weight:500">'+esc(n.prop.text)+'</p><div class="row" style="flex-wrap:wrap"><button class="btn primary small" data-a="propYes" data-id="'+n.id+'">Applica</button><button class="btn small" data-a="propNo" data-id="'+n.id+'">Ignora</button></div></div>';
    else if(n.state==='applicata')h+='<p class="small" style="margin:10px 0 0;color:var(--success-ink)">Modifica applicata: '+esc(n.prop.text)+'</p>';
    else if(n.state==='ignorata')h+='<p class="small subtle" style="margin:10px 0 0">Proposta ignorata.</p>';
    else if(n.err)h+='<p class="small" style="margin:10px 0 0;color:var(--warning-ink)">'+esc(n.err)+'</p>';
    h+='</div>';
  });
  h+='</div></div>';
  return h;
}

function viewSheet(){
  var s=UI.sheet;if(!s)return '';
  var inner='';
  if(s.type==='done'){
    var c=classOf(s.cls),a=c&&actOf(c,s.act);if(!a){UI.sheet=null;return '';}
    var d=dt(T),iso=d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0');
    inner='<h2 id="shTitle">'+esc(a.name)+'</h2><p class="small muted" style="margin:2px 0 16px">'+esc(c.name)+' · vale per tutta la classe</p>'+
      '<div class="stack"><div class="field"><label for="doneDate">Data</label><input class="input" type="date" id="doneDate" value="'+iso+'" max="'+iso+'"></div>'+
      '<div class="field"><label for="doneNote">Nota (facoltativa)</label><input class="input" id="doneNote" placeholder="Es. concime liquido" autocomplete="off"></div>'+
      '<div class="row" style="flex-wrap:wrap"><button class="btn primary grow" data-a="doneSave" data-c="'+c.id+'" data-t="'+a.id+'">Registra</button><button class="btn" data-a="sheetClose">Annulla</button></div></div>';
  }else if(s.type==='restore'){
    inner='<h2 id="shTitle">Backup dei dati</h2><p class="small muted" style="margin:2px 0 16px">'+(s.prefill?'Copia tutto il testo qui sotto e conservalo in un’app di note.':'Incolla qui il testo del backup. I dati attuali verranno sostituiti.')+'</p><div class="stack"><div class="field"><label for="restoreText">Testo del backup</label><textarea class="input" id="restoreText" style="min-height:140px;font-size:14px">'+esc(s.prefill||'')+'</textarea><p class="hint" id="restoreErr" style="color:var(--error-ink)" hidden>Il testo non è un backup valido.</p></div><div class="row" style="flex-wrap:wrap">'+(s.prefill?'':'<button class="btn primary grow" data-a="restoreSave">Ripristina</button>')+'<button class="btn'+(s.prefill?' primary grow':'')+'" data-a="sheetClose">'+(s.prefill?'Chiudi':'Annulla')+'</button></div></div>';
  }else if(s.type==='newcls'){
    inner='<h2 id="shTitle">Nuova classe</h2><div class="stack" style="margin-top:16px"><div class="field"><label for="ncName">Nome</label><input class="input" id="ncName" placeholder="Es. Bulbose" autocomplete="off"></div>'+
      '<div class="field"><label for="ncEnv">Ambiente</label><select class="input" id="ncEnv"><option>Interno</option><option>Esterno</option><option>Entrambi</option></select></div>'+
      '<div class="row" style="flex-wrap:wrap"><button class="btn primary grow" data-a="newClsSave">Crea classe</button><button class="btn" data-a="sheetClose">Annulla</button></div></div>';
  }
  return '<div class="scrim" data-a="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle">'+inner+'</div></div>';
}

function tabbar(){

}

var appEl=document.getElementById('app'),layer=document.getElementById('layer'),toastTimer=null;
function render(){
  var v=UI.tab==='oggi'?viewOggi():UI.tab==='cal'?viewCal():UI.tab==='classi'?viewClassi():viewNote();
  appEl.innerHTML='<header class="brand"><img src="'+LOGO+'" alt="PlantQ" width="140"></header>'+v;
  layer.innerHTML=viewSheet()+tabbar()+(UI.toast?'<div class="toast" role="status">'+esc(UI.toast)+'</div>':'');
}
function toast(t){UI.toast=t;render();clearTimeout(toastTimer);toastTimer=setTimeout(function(){UI.toast='';render();},2400);}
function go(tab){UI.tab=tab;UI.cls=null;UI.edit=false;UI.confirm=null;window.scrollTo(0,0);}

/* ---------- eventi ---------- */
var H={
 print:function(){window.print();},
 backupCopy:function(){var j=JSON.stringify(S);var fail=function(){UI.sheet={type:'restore',prefill:j};render();};try{navigator.clipboard.writeText(j).then(function(){toast('Backup copiato. Incollalo in un’app di note per conservarlo.');},fail);}catch(e){fail();}},
 restoreOpen:function(){UI.sheet={type:'restore',prefill:''};render();},
 restoreSave:function(){var v=document.getElementById('restoreText').value.trim();try{var o=JSON.parse(v);if(!o||!Array.isArray(o.classes)||!Array.isArray(o.log))throw 0;o.notes=o.notes||[];S=o;save();UI.sheet=null;toast('Backup ripristinato.');}catch(e){var m=document.getElementById('restoreErr');if(m)m.hidden=false;}},
 tab:function(t){go(t.dataset.v);render();},
 mprev:function(){UI.m--;if(UI.m<0){UI.m=11;UI.y--;}UI.sel=dnOf(UI.y,UI.m,1);render();},
 mnext:function(){UI.m++;if(UI.m>11){UI.m=0;UI.y++;}UI.sel=dnOf(UI.y,UI.m,1);render();},
 mtoday:function(){UI.y=yearOf(T);UI.m=dt(T).getUTCMonth();UI.sel=T;render();},
 sel:function(t){UI.sel=+t.dataset.v;render();},
 openCls:function(t){UI.cls=t.dataset.c;UI.edit=false;UI.confirm=null;window.scrollTo(0,0);render();},
 back:function(){UI.cls=null;UI.edit=false;UI.confirm=null;render();},
 toggle:function(t){var c=classOf(t.dataset.c);c.on=!c.on;save();render();},
 editToggle:function(){UI.edit=!UI.edit;UI.confirm=null;render();},
 doneOpen:function(t){UI.sheet={type:'done',cls:t.dataset.c,act:t.dataset.t};render();setTimeout(function(){var e=document.getElementById('doneNote');if(e)e.focus({preventScroll:true});},30);},
 doneSave:function(t){
   var v=document.getElementById('doneDate').value,note=document.getElementById('doneNote').value.trim(),dn=T;
   if(v){var p=v.split('-');dn=dnOf(+p[0],+p[1]-1,+p[2]);}
   if(dn>T)dn=T;
   markDone(t.dataset.c,t.dataset.t,dn,note);UI.sheet=null;toast('Registrata: la prossima data è stata ricalcolata.');
 },
 sheetClose:function(){UI.sheet=null;render();},
 scrim:function(t,e){if(e.target===t){UI.sheet=null;render();}},
 undo:function(t){undoLog(t.dataset.id);toast('Registrazione annullata.');},
 addPlant:function(t){var i=document.getElementById('newPlant'),v=i.value.trim();if(!v)return;classOf(t.dataset.c).plants.push(v);save();render();},
 delPlant:function(t){classOf(t.dataset.c).plants.splice(+t.dataset.i,1);save();render();},
 addAct:function(t){var i=document.getElementById('newAct'),v=i.value.trim();if(!v)return;classOf(t.dataset.c).acts.push({id:uid(),name:v,bands:[{a:T?monthOf(T):1,b:monthOf(T),d:7}],last:null});save();render();},
 toggleAct:function(t){var a=actOf(classOf(t.dataset.c),t.dataset.t);a.on=(a.on===false);save();render();},
 delActAsk:function(t){UI.confirm='delact:'+t.dataset.t;render();},
 delActYes:function(t){var c=classOf(t.dataset.c);c.acts=c.acts.filter(function(a){return a.id!==t.dataset.t;});S.log=S.log.filter(function(l){return l.actId!==t.dataset.t;});UI.confirm=null;save();render();},
 addBand:function(t){var a=actOf(classOf(t.dataset.c),t.dataset.t);a.bands.push({a:1,b:12,d:14});save();render();},
 delBand:function(t){var a=actOf(classOf(t.dataset.c),t.dataset.t);a.bands.splice(+t.dataset.i,1);save();render();},
 newClsOpen:function(){UI.sheet={type:'newcls'};render();setTimeout(function(){var e=document.getElementById('ncName');if(e)e.focus({preventScroll:true});},30);},
 newClsSave:function(){
   var n=document.getElementById('ncName').value.trim();if(!n)return;
   var pal=['#B8862B','#5E8063','#B07474','#4F8299','#7E8F4E','#8E5F86','#B56A44','#6F6A8F'];
   S.classes.push({id:uid(),name:n,env:document.getElementById('ncEnv').value,plants:[],acts:[],on:true,color:pal[S.classes.length%pal.length]});
   save();UI.sheet=null;toast('Classe creata. Apri la classe per aggiungere attività.');
 },
 delClsAsk:function(){UI.confirm='delcls';render();},
 confirmNo:function(){UI.confirm=null;render();},
 delClsYes:function(t){S.classes=S.classes.filter(function(c){return c.id!==t.dataset.c;});S.log=S.log.filter(function(l){return l.clsId!==t.dataset.c;});save();UI.cls=null;UI.edit=false;UI.confirm=null;render();},
 resetAsk:function(){UI.confirm='reset';render();},
 resetNo:function(){UI.confirm=null;render();},
 resetYes:function(){S=seed();save();UI.confirm=null;toast('Classi iniziali ripristinate.');},
 noteSave:function(){
   var tx=document.getElementById('noteText').value.trim(),link=document.getElementById('noteLink').value;if(!tx)return;
   var n={id:uid(),text:tx,link:link,dn:T,state:'salvata'},r=analyze(tx,link);
   if(r&&r.error)n.err=r.error;else if(r){n.prop=r;n.state='proposta';}
   S.notes.push(n);save();UI.draft='';UI.draftLink='';
   toast(n.prop?'Nota salvata. Ho preparato una modifica da confermare.':'Nota salvata.');
 },
 noteDel:function(t){S.notes=S.notes.filter(function(n){return n.id!==t.dataset.id;});save();render();},
 propYes:function(t){var n=S.notes.find(function(x){return x.id===t.dataset.id;});applyProposal(n.prop);n.state='applicata';save();toast('Modifica applicata a classi e calendario.');},
 propNo:function(t){var n=S.notes.find(function(x){return x.id===t.dataset.id;});n.state='ignorata';save();render();}
};
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-a]');if(!t)return;
  var f=H[t.dataset.a];if(f)f(t,e);
});
document.addEventListener('input',function(e){
  if(e.target.id==='noteText')UI.draft=e.target.value;
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='noteLink'){UI.draftLink=t.value;return;}
  var k=t.dataset&&t.dataset.c;if(!k||!t.dataset.k)return;
  var a=actOf(classOf(t.dataset.k),t.dataset.t);if(!a)return;
  if(k==='actNote'){a.note=t.value.trim();save();render();return;}
  var b=a.bands[+t.dataset.i];if(!b)return;
  if(k==='bandA')b.a=+t.value;
  else if(k==='bandB')b.b=+t.value;
  else if(k==='bandF')b.d=parseInt(t.value,10)||0;
  else if(k==='bandN'){var n=Math.max(1,Math.min(365,parseInt(t.value,10)||1));b.d=n;}
  save();render();
});
render();
})();
</script>
